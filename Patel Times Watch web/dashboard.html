<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="View your Patel Times account information and local order history.">
    <title>Dashboard | Patel Times</title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body data-page="dashboard">
    <header id="site-header" class="site-header"></header>

    <main>
      <section class="section">
        <div class="container">
          <div class="page-banner glass-card" data-reveal>
            <div class="page-banner-grid">
              <div>
                <span class="eyebrow">Dashboard</span>
                <h1>Account and orders</h1>
                <p>Review your local Patel Times purchases, order totals, and current signed-in account details.</p>
              </div>
              <div class="chip-row">
                <span class="chip">Welcome Message</span>
                <span class="chip">Order Status</span>
                <span class="chip">Logout Support</span>
              </div>
            </div>
          </div>

          <div class="dashboard-layout" style="margin-top: 1.5rem;">
            <div id="dashboard-body" style="grid-column: 1 / -1;"></div>
          </div>
        </div>
      </section>
    </main>

    <footer id="site-footer"></footer>

    <script src="js/script.js" defer></script>
    <script src="js/cart.js" defer></script>
    <script src="js/auth.js" defer></script>
  </body>
</html>
