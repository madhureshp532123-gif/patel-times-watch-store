<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login to your Patel Times account and access your order dashboard.">
    <title>Login | Patel Times</title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body data-page="login">
    <header id="site-header" class="site-header"></header>

    <main>
      <section class="section">
        <div class="container">
          <div class="auth-layout">
            <article class="auth-copy glass-card" data-reveal>
              <span class="eyebrow">Login</span>
              <h1>Return to your private showroom</h1>
              <p>
                Sign in to review local orders, continue shopping, and access a personalized Patel Times dashboard.
              </p>
              <div class="chip-row">
                <span class="chip">Local Auth</span>
                <span class="chip">Dashboard Redirect</span>
                <span class="chip">Order Tracking</span>
              </div>
            </article>

            <article class="form-card glass-card" data-reveal style="--delay:1;">
              <h2>Login to Continue</h2>
              <form id="login-form" class="form-grid">
                <div class="input-group full">
                  <label for="login-email">Email</label>
                  <input class="input" id="login-email" name="email" type="email" placeholder="Enter your email" required>
                </div>
                <div class="input-group full">
                  <label for="login-password">Password</label>
                  <input class="input" id="login-password" name="password" type="password" placeholder="Enter your password" required>
                </div>
                <div class="input-group full">
                  <button class="btn btn-primary btn-block" type="submit">Login</button>
                </div>
              </form>
              <div id="login-message"></div>
              <p class="muted-line">Need an account? <a class="link-button" href="register.html">Register here</a>.</p>
            </article>
          </div>
        </div>
      </section>
    </main>

    <footer id="site-footer"></footer>

    <script src="js/script.js" defer></script>
    <script src="js/cart.js" defer></script>
    <script src="js/auth.js" defer></script>
  </body>
</html>
