<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="View product details for a Patel Times watch.">
    <title>Watch Details | Patel Times</title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body data-page="product">
    <header id="site-header" class="site-header"></header>

    <main>
      <section class="section">
        <div class="container">
          <div class="page-banner glass-card" data-reveal>
            <div class="page-banner-grid">
              <div>
                <span class="eyebrow">Product</span>
                <h1>Product spotlight</h1>
                <p>Experience detailed craftsmanship, clear specifications, and a direct path to cart.</p>
              </div>
              <div class="chip-row">
                <span class="chip">Detailed Specs</span>
                <span class="chip">Luxury Styling</span>
                <span class="chip">Local Cart</span>
              </div>
            </div>
          </div>

          <div id="product-detail" style="margin-top: 1.5rem;"></div>
        </div>
      </section>

      <section class="section">
        <div class="container">
          <div class="section-heading" data-reveal>
            <span class="eyebrow">Related Watches</span>
            <h2>More pieces from the same design mood</h2>
            <p>Continue exploring handpicked alternatives across the same collection family.</p>
          </div>
          <div class="product-grid" id="related-products"></div>
        </div>
      </section>
    </main>

    <footer id="site-footer"></footer>

    <script src="js/script.js" defer></script>
    <script src="js/cart.js" defer></script>
    <script src="js/auth.js" defer></script>
  </body>
</html>
